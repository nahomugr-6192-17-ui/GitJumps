<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>GitJumps</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var container = document.querySelector("#unity-container");

      // Aspect ratio for GitJumps (16:9)
      var targetAspect = 16 / 9;

      function resizeCanvas() {
        var containerWidth = container ? container.clientWidth : window.innerWidth;
        var containerHeight = container ? container.clientHeight : window.innerHeight;

        if (!containerWidth || !containerHeight) return;

        var windowAspect = containerWidth / containerHeight;
        var canvasWidth, canvasHeight;

        if (windowAspect > targetAspect) {
          // Window is wider than 16:9 -> fit to height, pillarbox left & right
          canvasHeight = containerHeight;
          canvasWidth = containerHeight * targetAspect;
        } else {
          // Window is taller than 16:9 -> fit to width, letterbox top & bottom
          canvasWidth = containerWidth;
          canvasHeight = containerWidth / targetAspect;
        }

        canvasWidth = Math.floor(canvasWidth);
        canvasHeight = Math.floor(canvasHeight);

        // Apply CSS display dimensions
        canvas.style.width = canvasWidth + "px";
        canvas.style.height = canvasHeight + "px";

        // Keep render resolution synchronized with CSS dimensions
        var pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(canvasWidth * pixelRatio);
        canvas.height = Math.floor(canvasHeight * pixelRatio);
      }

      // Initial sizing before Unity starts loading
      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);
      window.addEventListener("orientationchange", resizeCanvas);
      if (typeof ResizeObserver !== "undefined" && container) {
        new ResizeObserver(resizeCanvas).observe(container);
      }

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/GitJumps - Web.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/GitJumps - Web.data",
        frameworkUrl: buildUrl + "/GitJumps - Web.framework.js",
        codeUrl: buildUrl + "/GitJumps - Web.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Papa Smurf",
        productName: "GitJumps",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function() {
        createUnityInstance(canvas, config, function(progress) {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then(function(unityInstance) {
          document.querySelector("#unity-loading-bar").style.display = "none";
          // Re-synchronize dimensions and trigger engine viewport recalculation
          resizeCanvas();
          window.dispatchEvent(new Event("resize"));
        }).catch(function(message) {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
